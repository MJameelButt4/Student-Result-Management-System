{% extends "base.html" %}

{% block title %}
Student Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fa-solid fa-user me-2"></i>
                        Create Student Profile
                    </h4>
                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Name</label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>

                            <input
                                type="number"
                                name="age"
                                class="form-control"
                                min="1"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Department</label>

                            <input
                                type="text"
                                name="department"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Semester</label>

                            <input
                                type="number"
                                name="semester"
                                class="form-control"
                                min="1"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            <i class="fa-solid fa-user-plus me-2"></i>
                            Create Profile
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
