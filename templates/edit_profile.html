{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        <i class="fa-solid fa-user-pen me-2"></i>
                        Edit Student Profile
                    </h4>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ student['name'] }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Age
                            </label>

                            <input
                                type="number"
                                name="age"
                                class="form-control"
                                value="{{ student['age'] }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <input
                                type="text"
                                name="department"
                                class="form-control"
                                value="{{ student['department'] }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Semester
                            </label>

                            <input
                                type="number"
                                name="semester"
                                class="form-control"
                                value="{{ student['semester'] }}"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >

                            <i class="fa-solid fa-floppy-disk me-2"></i>

                            Update Profile

                        </button>

                    </form>


                    <div class="text-center mt-3">

                        <a
                            href="/dashboard"
                            class="btn btn-outline-secondary"
                        >

                            <i class="fa-solid fa-arrow-left me-2"></i>

                            Back to Dashboard

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
